services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: rewind
      POSTGRES_DB: rewind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rewind"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://postgres:rewind@db:5432/rewind
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      REWIND_ACCESS_KEY: ${REWIND_ACCESS_KEY:?set REWIND_ACCESS_KEY}
      DATA_DIR: /data
    volumes:
      - rewind-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rewind-data:
